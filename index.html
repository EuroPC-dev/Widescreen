<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="14850">
<title>Dashboard Fullscreen</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.cdnfonts.com/css/garet" rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #000;
    overflow: hidden;
    font-family: sans-serif;
  }

  /* Fullscreen container voor de video */
  .video-background {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    z-index: 1;
  }

  /* Video reaches full vertical height at all times while maintaining aspect ratio */
  .video-wrapper {
    height: 100vh;
    width: calc(100vh * (32 / 9)); /* Dynamically calculates width to match height at 32:9 ratio */
    min-width: 100vw;               /* Prevents horizontal black bars if screen is wider than 32:9 */
    pointer-events: none;
  }

  .video-wrapper iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  /* Overlay container voor alleen de klok */
  .overlay-content {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 15vh;
    pointer-events: none;
  }

  /* Klok in het wit met sterkere contrast-schaduw */
  .clock {
    font-family: 'Garet', sans-serif;
    font-size: 180px;
    font-weight: 850;
    color: #ffffff; 
    letter-spacing: -2px; 
    line-height: 0.82;
    font-variant-numeric: tabular-nums; 
    
    text-shadow: 
      0 4px 12px rgba(0, 0, 0, 0.9),
      0 8px 30px rgba(0, 0, 0, 0.8),
      0 16px 50px rgba(0, 0, 0, 0.6);
  }

  .clock .colon {
    font-weight: 300;
    font-size: 0.80em;
    position: relative;
    top: -0.1em;
  }
</style>
</head>
<body>

  <!-- Achtergrond video container -->
  <div class="video-background">
    <div class="video-wrapper">
      <iframe 
        src="https://www.youtube-nocookie.com/embed/videoseries?list=PLI0Kam9cdM9k&autoplay=1&mute=1&loop=1&playlist=PLI0Kam9cdM9k" 
        allow="autoplay; encrypted-media" 
        allowfullscreen>
      </iframe>
    </div>
  </div>

  <!-- Overlay met alleen de Klok -->
  <div class="overlay-content">
    <div class="clock" id="clock">00<span class="colon">:</span>00</div>
  </div>

<script>
  function updateClock() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    
    document.getElementById('clock').innerHTML = `${hours}<span class="colon">:</span>${minutes}`;
  }

  updateClock();
  setInterval(updateClock, 1000);
</script>

</body>
</html>
